[project]
name = "backend"
version = "0.1.0"
description = "Patent search engine for the Thinkstruct take-home"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.4",
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "sentence-transformers>=6.2.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
