services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]   # 15672 = management UI (guest / guest)
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: poc, POSTGRES_PASSWORD: poc, POSTGRES_DB: poc}
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
